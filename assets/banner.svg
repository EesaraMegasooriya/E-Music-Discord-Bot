<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 480" width="1360" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f3d"/>
      <stop offset="0.55" stop-color="#0f0a26"/>
      <stop offset="1" stop-color="#070616"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#ff3cac" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3cac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2bd2ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2bd2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="0.56" cy="0.42" r="0.4">
      <stop offset="0" stop-color="#9b4dff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="420" y1="120" x2="1120" y2="300">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="0.5" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#2bd2ff"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1360" y2="0">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="0.5" stop-color="#9b4dff"/>
      <stop offset="1" stop-color="#2bd2ff"/>
    </linearGradient>
    <linearGradient id="barsFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="fadeMask"><rect x="0" y="280" width="1360" height="200" fill="url(#barsFade)"/></mask>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1360" height="480" fill="url(#bg)"/>
  <rect width="1360" height="480" fill="url(#glowPink)"/>
  <rect width="1360" height="480" fill="url(#glowCyan)"/>
  <rect width="1360" height="480" fill="url(#glowCenter)"/>

  <!-- sound waves radiating from the right -->
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" opacity="0.22">
    <path d="M 1180 90 A 170 170 0 0 1 1180 330" stroke-width="10"/>
    <path d="M 1230 50 A 230 230 0 0 1 1230 370" stroke-width="8" opacity="0.7"/>
    <path d="M 1280 10 A 290 290 0 0 1 1280 410" stroke-width="6" opacity="0.5"/>
  </g>

