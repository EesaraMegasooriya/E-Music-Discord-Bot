<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#2a1550"/>
      <stop offset="0.6" stop-color="#140b2e"/>
      <stop offset="1" stop-color="#07061a"/>
    </radialGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="132" y1="136" x2="404" y2="376">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="0.5" stop-color="#9b4dff"/>
      <stop offset="1" stop-color="#2bd2ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#2bd2ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <g transform="translate(-14 0)" filter="url(#glow)">
    <!-- the "E": arms of different lengths read as equalizer levels -->
    <g fill="url(#neon)">
      <rect x="132" y="136" width="56" height="240" rx="28"/>
      <rect x="132" y="136" width="208" height="56" rx="28"/>
      <rect x="132" y="228" width="160" height="56" rx="28"/>
      <rect x="132" y="320" width="188" height="56" rx="28"/>
    </g>
    <!-- sound waves coming off the middle arm -->
    <g fill="none" stroke="url(#neon)" stroke-linecap="round">
      <path d="M 343 214 A 60 60 0 0 1 343 298" stroke-width="20"/>
      <path d="M 376 186 A 100 100 0 0 1 376 326" stroke-width="20" opacity="0.75"/>
    </g>
  </g>
</svg>
